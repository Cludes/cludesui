name: Release

# A push to master that changes the addons, once some commit since the last
# tag carries a "Player: ..." line (see the Version step), becomes a release: the next
# patch version after the newest vX.Y.Z tag is tagged on that commit and
# published as CludesUI-vX.Y.Z.zip (every addon folder, with that version
# stamped into each .toc and CludesUI.VERSION) with notes listing each change
# since the previous tag. A push that only changes tools, docs or this
# workflow makes none. tools/release.sh still makes a minor or major (or any
# chosen) version: its tag push releases that tag, and its "Release vX"
# commit makes no extra patch release.

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'tools/**'
      - '**.md'
      - '.github/**'
      - '.stylua.toml'
      - '.gitignore'
  # Run by hand (Actions > Release > Run workflow): releases master's newest commit.
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so each one numbers from the tag the last one made.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force -q
          # A commit release.sh tagged already, or its own "Release vX" commit.
          if git tag --points-at HEAD | grep -q '^v' || git log -1 --format=%s | grep -q '^Release v'; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          # A push releases only once a commit since the last tag says what players
          # get (a "Player: ..." body line); until then its changes wait for the
          # next one. A hand run (workflow_dispatch) always releases.
          paths=". :!tools :!.github :!*.md :!.stylua.toml :!.gitignore"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git log --format=%B "$last..HEAD" -- $paths | grep -q '^Player:'; then
            echo "No Player: line since $last; no release."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          tag="v$major.$minor.$((patch + 1))"
          git tag "$tag" HEAD
          git push -q origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build zip
        if: steps.version.outputs.skip != '1'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir out
          cp -r CludesUI*/ out/
          # Line endings kept: only the number changes.
          sed -i "s/^\(## Version: *\)[0-9][0-9.]*/\1$version/" out/*/*.toc
          sed -i "s/^\(CUI\.VERSION = \"\)[0-9.]*\"/\1$version\"/" out/CludesUI/CludesUI.lua
          (cd out && zip -r -q "../CludesUI-$TAG.zip" .)

      # CurseForge gets every few releases, not each one: a version cut with
      # tools/release.sh (a tag push) goes up at once, others once CF_EVERY
      # releases have built up since the last upload. The "curseforge" tag marks
      # the last uploaded release; its notes cover everything since it.
      - name: CurseForge due
        id: cf
        if: steps.version.outputs.skip != '1'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CF_EVERY: 5
        run: |
          git fetch --tags --force -q
          last=$(git rev-parse -q --verify "refs/tags/curseforge^{commit}" || true)
          due=0
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ -z "$last" ]; then
            due=1
          else
            since=$(( $(git tag --list 'v*' --contains "$last" | wc -l) - 1 ))
            echo "$since release(s) since the last CurseForge upload"
            if [ "$since" -ge "$CF_EVERY" ]; then due=1; fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "since=$last" >> "$GITHUB_OUTPUT"

      - name: Release notes
        if: steps.version.outputs.skip != '1'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CF_SINCE: ${{ steps.cf.outputs.since }}
        # notes.md (GitHub) and cf_notes.md (CurseForge): the commits' Player: lines,
        # grouped New and improved / Fixed (tools/release_notes.py).
        run: python3 tools/release_notes.py

      - name: Publish
        if: steps.version.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "CludesUI-$TAG.zip" --clobber
            gh release edit "$TAG" --title "CludesUI $TAG" --notes-file notes.md
          else
            gh release create "$TAG" "CludesUI-$TAG.zip" --title "CludesUI $TAG" --notes-file notes.md --verify-tag
          fi

      - name: Upload to CurseForge
        if: steps.version.outputs.skip != '1' && steps.cf.outputs.due == '1'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 tools/curseforge_upload.py
          git tag -f curseforge "$TAG^{commit}"
          git push -q -f origin refs/tags/curseforge
